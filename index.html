<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECPLACE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f8f8;
        }
       
        p {
            position: absolute;
            top: 90px;
            right: 190px;
            color: #ffffff; 
            font-size: 20px; 
            font-family: 'Helvetica', sans-serif; 
            font-weight: bold; 
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.3); 
            transition: all 0.3s ease;
        }
        

        .imagen1 {
            position: absolute;
            top: 0px;
            left: 100px;
        }
        .imagen2 {
            position: absolute;
            top: 70px;
            right: 80px;
            width: 100px;
        }
        .barra-color {
            background-color: #46456e; 
            height: 200px;  
            width: 100%;  
            position: fixed; 
            top: 0;
            left: 0;
        }
        
        

        .categoria {
            position: absolute;
            top: 90px;
            left: 320px;
            color: #ffffff; 
            font-size: 20px; 
            font-family: 'Helvetica', sans-serif; 
            font-weight: bold; 
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.6); 
            transition: all 0.3s ease;
            
        }

        .vender {
            position: absolute;
            left: 50%;
            top: 90px;
            color: #ffffff; 
            font-size: 20px; 
            font-family: 'Helvetica', sans-serif; 
            font-weight: bold; 
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.6); 
            transition: all 0.3s ease;
        }

        .LoMasVendido {
            position: absolute;
            top: 90px;
            right: 320px;
            color: #ffffff; 
            font-size: 20px; 
            font-family: 'Helvetica', sans-serif; 
            font-weight: bold; 
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.6); 
            transition: all 0.3s ease;
        }
        .barra-busqueda {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 250px; 
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
        }
        
        .input-busqueda {
            
            width: 300px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }
        
        .boton-busqueda {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4c5a89;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .boton-busqueda:hover {
            background-color: #7379a7;
        }
        
       
        body {
            font-family: Arial, sans-serif;
            margin-top: 100px;
        }
       
    </style>
</head>
<body>
    
    <div class="barra-color"></div>
    <p>USER</p>
    <img class="imagen1" src="TEC-removebg-preview.PNG" alt="Ejemplo" width="200"> 
    <img class="imagen2" src="pfp.PNG" alt="Ejemplo" width="200"> 
    <div class="barra-busqueda">
        <form action="#">
            <input type="text" placeholder="Buscar..." class="input-busqueda">
            <button type="submit" class="boton-busqueda">Buscar</button>
        </form>
    <h2 class="categoria"> Categoria </h2>
    <h2 class="vender"> Vender </h2>
    <h2 class="LoMasVendido"> Lo más vendido </h2>
    
    

    
    
    
    
</body>
</html>
