<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECPLACE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .barra-color {
            background-color: #46456e;
            width: 100%;
            height: 200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .logo {
            width: 200px;
        }

        .user {
            width: 100px;
        }

        .menu-superior {
            display: flex;
            justify-content: center;
            gap: 20px; /* Espacio entre los elementos */
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        .menu-superior h2 {
            color: #ffffff;
            font-size: 20px;
            font-family: 'Helvetica', sans-serif;
            font-weight: bold;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.6);
            margin: 0;
        }

        .barra-busqueda {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 250px;
            width: 100%;
            z-index: 2;
        }

        .input-busqueda {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }

        .boton-busqueda {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4c5a89;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .boton-busqueda:hover {
            background-color: #7379a7;
        }

        @media (max-width: 768px) {
            .menu-superior {
                flex-direction: column;
                gap: 10px;
                top: 120px;
            }

            .barra-busqueda {
                margin-top: 300px;
            }

            .input-busqueda {
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="barra-color">
        <img class="logo" src="TEC-removebg-preview.PNG" alt="Logo">
        <img class="user" src="pfp.PNG" alt="Usuario">
    </div>

    <div class="menu-superior">
        <h2>Categoria</h2>
        <h2>Vender</h2>
        <h2>Lo más vendido</h2>
    </div>

    <div class="barra-busqueda">
        <form action="#">
            <input type="text" placeholder="Buscar..." class="input-busqueda">
            <button type="submit" class="boton-busqueda">Buscar</button>
        </form>
    </div>
</body>
</html>
